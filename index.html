<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Строгий viewport для мобильных устройств: отключает случайное масштабирование двойным тапом -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сольфеджио: Тренажер интервалов</title>
    
    <!-- Подключение библиотек -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a; /* Темно-синий фон (slate-900) */
            /* Кроссбраузерный скроллбар для Firefox */
            scrollbar-width: thin;
            scrollbar-color: #475569 transparent;
            /* Запрет выделения текста для ощущения "приложения" */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* Кастомный скроллбар для Chrome/Safari/Edge */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .btn-interval {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            /* Убирает задержку в 300мс на мобильных устройствах */
            touch-action: manipulation; 
        }
        .btn-interval:active { transform: scale(0.95); }
        
        button { touch-action: manipulation; }

        .pulse-animation {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.5); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(79, 70, 229, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
        }
    </style>
</head>
<body class="text-slate-100 antialiased min-h-screen flex flex-col items-center justify-center py-2 px-2 sm:px-6">

    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
        
        <!-- НАСТРОЙКИ (Левая часть) -->
        <div class="lg:col-span-7 bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 p-4 sm:p-6 space-y-4 sm:space-y-6">

            <!-- Выбор ноты, направления и тембра -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <!-- Базовая нота -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide">Базовая нота</label>
                    <div class="relative">
                        <select id="baseNoteSelect" class="block w-full pl-3 pr-8 py-2.5 text-sm border-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 rounded-xl border bg-slate-700 text-white hover:bg-slate-600 transition-colors cursor-pointer appearance-none">
                            <option value="chain">Цепочка (предыдущая)</option>
                            <option value="random">Случайная нота</option>
                            <!-- Генерируется JS -->
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <!-- Направление -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide">Направление</label>
                    <div class="flex p-1 bg-slate-900 rounded-xl space-x-1" id="directionToggle">
                        <button data-dir="up" class="flex-1 py-2 text-xs font-medium rounded-lg transition-colors focus:outline-none text-slate-300 hover:text-white">Вверх</button>
                        <button data-dir="both" class="flex-1 py-2 text-xs font-medium rounded-lg transition-colors focus:outline-none bg-indigo-600 shadow text-white">Любое</button>
                        <button data-dir="down" class="flex-1 py-2 text-xs font-medium rounded-lg transition-colors focus:outline-none text-slate-300 hover:text-white">Вниз</button>
                    </div>
                </div>

                <!-- Выбор тембра -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide">Тембр звука</label>
                    <div class="relative">
                        <select id="timbreSelect" class="block w-full pl-3 pr-8 py-2.5 text-sm border-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 rounded-xl border bg-slate-700 text-white hover:bg-slate-600 transition-colors cursor-pointer appearance-none">
                            <option value="soft" selected>Мягкий флейтовый</option>
                            <option value="sine">Чистый синус</option>
                            <option value="pad">Теплый пэд</option>
                            <option value="epiano">Акустический</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Громкость нот -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                <!-- Громкость базовой ноты -->
                <div class="space-y-1">
                    <div class="flex justify-between items-end">
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide">Громкость: База</label>
                        <span id="volBaseLabel" class="text-xs font-bold text-indigo-300 bg-indigo-900/50 border border-indigo-700/50 px-1.5 py-0.5 rounded">20%</span>
                    </div>
                    <div class="pt-1">
                        <input type="range" id="volBaseSlider" min="0" max="100" step="1" value="20" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    </div>
                </div>

                <!-- Громкость целевой ноты -->
                <div class="space-y-1">
                    <div class="flex justify-between items-end">
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide">Громкость: Цель</label>
                        <span id="volTargetLabel" class="text-xs font-bold text-emerald-300 bg-emerald-900/50 border border-emerald-700/50 px-1.5 py-0.5 rounded">20%</span>
                    </div>
                    <div class="pt-1">
                        <input type="range" id="volTargetSlider" min="0" max="100" step="1" value="20" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                    </div>
                </div>
            </div>

            <!-- Выбор интервалов -->
            <div class="space-y-2">
                <div class="flex justify-between items-end">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide">Изучаемые интервалы</label>
                    <button id="selectAllBtn" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Выбрать все</button>
                </div>
                
                <div class="bg-slate-900/50 p-2.5 sm:p-3 rounded-xl border border-slate-700">
                    <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 mb-2" id="intervalRow1">
                        <!-- Малые и чистые (генерируется JS) -->
                    </div>
                    <div class="grid grid-cols-3 sm:grid-cols-6 gap-2" id="intervalRow2">
                        <!-- Большие и чистые (генерируется JS) -->
                    </div>
                </div>
            </div>
        </div>

        <!-- РАБОЧАЯ ОБЛАСТЬ (Правая часть) -->
        <div class="lg:col-span-5 bg-gradient-to-br from-indigo-950 to-slate-800 rounded-3xl shadow-2xl border border-slate-700 p-5 sm:p-6 flex flex-col justify-between relative overflow-hidden min-h-[380px] sm:min-h-[440px]">
            <!-- Декоративные элементы фона -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500 opacity-10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-500 opacity-10 rounded-full blur-2xl pointer-events-none"></div>

            <!-- Статус и Задание -->
            <div class="relative z-10 flex flex-col h-full">
                
                <div class="flex justify-center items-center mb-4">
                    <span class="bg-slate-800/80 text-indigo-200 text-xs font-bold uppercase tracking-wider py-1 px-3 rounded-full border border-slate-600 shadow-sm">
                        Текущее задание
                    </span>
                </div>

                <div id="taskDisplay" class="flex-grow flex flex-col items-center justify-center text-center space-y-3">
                    <p class="text-slate-300 text-sm sm:text-base font-medium">Постройте от ноты</p>
                    <div class="bg-slate-800/80 p-3 rounded-2xl w-full border border-slate-600 shadow-inner">
                        <h3 id="uiBaseNote" class="text-2xl sm:text-3xl font-black text-white drop-shadow-md">До (c¹)</h3>
                    </div>
                    
                    <div class="flex items-center gap-3 my-1 sm:my-2">
                        <span id="uiDirectionIcon" class="bg-slate-700 p-2 rounded-full text-white">
                            <!-- Иконка стрелки -->
                        </span>
                        <h3 id="uiInterval" class="text-2xl sm:text-3xl font-bold text-white drop-shadow-md">м3</h3>
                        <span class="text-slate-300 text-base sm:text-lg" id="uiDirectionText">вверх</span>
                    </div>
                    
                    <!-- Блок ответа (скрыт до проверки) -->
                    <div id="answerBlock" class="opacity-0 transition-opacity duration-500 h-10 sm:h-12 flex items-center justify-center">
                        <p class="text-emerald-400 font-semibold text-sm sm:text-base flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            Цель: <span id="uiTargetNote" class="text-lg sm:text-xl font-bold text-white ml-1">Ми-бемоль (es¹)</span>
                        </p>
                    </div>
                </div>

                <!-- Кнопки воспроизведения -->
                <div class="mt-4 sm:mt-6 space-y-2.5 z-10">
                    <button id="playBaseBtn" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white font-medium py-2.5 px-4 rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm text-sm">
                        <svg class="w-4 h-4 text-indigo-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                        Дать тон (База)
                    </button>
                    
                    <div class="flex gap-2">
                        <button id="checkBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-3 rounded-xl shadow-lg shadow-indigo-900/50 transition-all flex items-center justify-center gap-2 pulse-animation">
                            <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                            <span class="text-xs sm:text-sm truncate">Проверить</span>
                        </button>
                        
                        <button id="nextTaskBtn" class="flex-1 bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white font-bold py-3 px-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                            <span class="text-xs sm:text-sm truncate">Дальше</span>
                            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const NOTE_NAMES_RU = {
            'C': 'До', 'C#': 'До#', 'D': 'Ре', 'D#': 'Ре#', 'E': 'Ми', 'F': 'Фа',
            'F#': 'Фа#', 'G': 'Соль', 'G#': 'Соль#', 'A': 'Ля', 'A#': 'Ля#', 'B': 'Си'
        };

        // Академические названия с учетом знаков альтерации и октав (латинские буквенные обозначения)
        const ACADEMIC_NAMES = {
            'C': { 3: 'c', 4: 'c¹', 5: 'c²' },
            'C#': { 3: 'cis', 4: 'cis¹', 5: 'cis²' },
            'D': { 3: 'd', 4: 'd¹', 5: 'd²' },
            'D#': { 3: 'dis', 4: 'dis¹', 5: 'dis²' },
            'E': { 3: 'e', 4: 'e¹', 5: 'e²' },
            'F': { 3: 'f', 4: 'f¹', 5: 'f²' },
            'F#': { 3: 'fis', 4: 'fis¹', 5: 'fis²' },
            'G': { 3: 'g', 4: 'g¹', 5: 'g²' },
            'G#': { 3: 'gis', 4: 'gis¹', 5: 'gis²' },
            'A': { 3: 'a', 4: 'a¹', 5: 'a²' },
            'A#': { 3: 'ais', 4: 'ais¹', 5: 'ais²' },
            'B': { 3: 'h', 4: 'h¹', 5: 'h²' }
        };

        // Генерация диапазона (от C2 до C6)
        const FULL_SCALE = [];
        for (let octave = 2; octave <= 6; octave++) {
            for (let note of NOTES) {
                FULL_SCALE.push(note + octave);
            }
        }

        // Диапазон для случайной генерации базовой ноты
        const RANDOM_BASE_MIN_INDEX = FULL_SCALE.indexOf('C3');
        const RANDOM_BASE_MAX_INDEX = FULL_SCALE.indexOf('C4');

        // Комфортный вокальный диапазон (от C3 до E4)
        const VOCAL_MIN_INDEX = FULL_SCALE.indexOf('C3');
        const VOCAL_MAX_INDEX = FULL_SCALE.indexOf('E4');

        // Определение интервалов для 2-х рядов
        const INTERVALS = [
            // Ряд 1: Малые и чистые (6 штук)
            { id: 'm2', name: 'Малая секунда', short: 'м2', semitones: 1, row: 1 },
            { id: 'm3', name: 'Малая терция', short: 'м3', semitones: 3, row: 1 },
            { id: 'P4', name: 'Чистая кварта', short: 'ч4', semitones: 5, row: 1 },
            { id: 'TT', name: 'Тритон', short: 'ув4/ум5', semitones: 6, row: 1 },
            { id: 'm6', name: 'Малая секста', short: 'м6', semitones: 8, row: 1 },
            { id: 'm7', name: 'Малая септима', short: 'м7', semitones: 10, row: 1 },

            // Ряд 2: Большие и чистые (6 штук)
            { id: 'M2', name: 'Большая секунда', short: 'б2', semitones: 2, row: 2 },
            { id: 'M3', name: 'Большая терция', short: 'б3', semitones: 4, row: 2 },
            { id: 'P5', name: 'Чистая квинта', short: 'ч5', semitones: 7, row: 2 },
            { id: 'M6', name: 'Большая секста', short: 'б6', semitones: 9, row: 2 },
            { id: 'M7', name: 'Большая септима', short: 'б7', semitones: 11, row: 2 },
            { id: 'P8', name: 'Чистая октава', short: 'ч8', semitones: 12, row: 2 }
        ];

        let state = {
            selectedIntervals: new Set(['m2', 'M2', 'm3', 'M3', 'P4', 'P5']),
            direction: 'both',
            baseNoteSetting: 'chain',
            currentTask: null,
            isDronePlaying: false,
            currentTimbre: 'soft'
        };

        let synthBase = null;
        let synthTarget = null;
        let audioInitialized = false;

        function getSynthConfig(type) {
            switch(type) {
                case 'sine':
                    return {
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.4, decay: 0.3, sustain: 1.0, release: 2.5 }
                    };
                case 'pad':
                    return {
                        oscillator: { type: "triangle8" },
                        envelope: { attack: 0.6, decay: 0.4, sustain: 0.9, release: 3.0 }
                    };
                case 'epiano':
                    return {
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.2, decay: 0.5, sustain: 0.8, release: 2.2 }
                    };
                case 'soft':
                default:
                    // Мягкий флейтовый тембр с долгим затуханием и без резких гармоник
                    return {
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.5, decay: 0.3, sustain: 1.0, release: 3.0 }
                    };
            }
        }

        async function initAudio() {
            if (audioInitialized) return;
            await Tone.start();
            
            const config = getSynthConfig(state.currentTimbre);
            synthBase = new Tone.Synth(config);
            synthTarget = new Tone.Synth(config);
            
            const reverb = new Tone.Reverb({ decay: 2.5, wet: 0.12 });
            const limiter = new Tone.Limiter(-6).toDestination();
            
            reverb.connect(limiter);
            
            synthBase.connect(reverb);
            synthTarget.connect(reverb);
            
            updateVolume(synthBase, document.getElementById('volBaseSlider').value);
            updateVolume(synthTarget, document.getElementById('volTargetSlider').value);
            
            audioInitialized = true;
        }

        function updateTimbre(type) {
            state.currentTimbre = type;
            if (!audioInitialized) return;
            const config = getSynthConfig(type);
            if (synthBase) synthBase.set(config);
            if (synthTarget) synthTarget.set(config);
        }

        function formatNoteAcademic(noteStr) {
            const match = noteStr.match(/([A-Z]#?)(\d)/);
            if (!match) return noteStr;
            const note = match[1];
            const octave = match[2];
            const nameRu = NOTE_NAMES_RU[note];
            const academicStr = ACADEMIC_NAMES[note] && ACADEMIC_NAMES[note][octave] ? ACADEMIC_NAMES[note][octave] : noteStr;
            return `${nameRu} (${academicStr})`;
        }

        function getArrowIcon(direction) {
            if (direction === 'up') {
                return `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>`;
            } else {
                return `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>`;
            }
        }

        const baseNoteSelect = document.getElementById('baseNoteSelect');
        const timbreSelect = document.getElementById('timbreSelect');
        const intervalRow1 = document.getElementById('intervalRow1');
        const intervalRow2 = document.getElementById('intervalRow2');
        const dirButtons = document.querySelectorAll('#directionToggle button');
        const selectAllBtn = document.getElementById('selectAllBtn');
        
        const volBaseSlider = document.getElementById('volBaseSlider');
        const volTargetSlider = document.getElementById('volTargetSlider');
        const volBaseLabel = document.getElementById('volBaseLabel');
        const volTargetLabel = document.getElementById('volTargetLabel');

        function updateVolume(synthInstance, val) {
            if (!synthInstance) return;
            synthInstance.volume.value = val <= 0 ? -Infinity : 20 * Math.log10(val / 100) - 6;
        }

        volBaseSlider.addEventListener('input', (e) => {
            volBaseLabel.textContent = `${e.target.value}%`;
            updateVolume(synthBase, e.target.value);
        });

        volTargetSlider.addEventListener('input', (e) => {
            volTargetLabel.textContent = `${e.target.value}%`;
            updateVolume(synthTarget, e.target.value);
        });

        timbreSelect.addEventListener('change', (e) => {
            updateTimbre(e.target.value);
        });

        // Заполнение селекта базовой ноты
        for (let i = RANDOM_BASE_MIN_INDEX; i <= RANDOM_BASE_MAX_INDEX; i++) {
            const note = FULL_SCALE[i];
            const option = document.createElement('option');
            option.value = note;
            option.textContent = formatNoteAcademic(note);
            if (note.includes('#')) option.textContent = ' ♯ ' + option.textContent;
            baseNoteSelect.appendChild(option);
        }

        function renderIntervalBtn(interval) {
            const btn = document.createElement('button');
            const isSelected = state.selectedIntervals.has(interval.id);
            
            const selectedClasses = 'bg-indigo-600 border-indigo-400 text-white shadow-[0_0_10px_rgba(79,70,229,0.5)]';
            const unselectedClasses = 'bg-slate-800 border-slate-600 text-slate-100 hover:bg-slate-700 hover:border-slate-500';
            
            btn.className = `btn-interval flex flex-col items-center justify-center p-2 rounded-xl border transition-all ${
                isSelected ? selectedClasses : unselectedClasses
            }`;
            
            btn.innerHTML = `
                <span class="text-sm sm:text-base font-bold drop-shadow-sm">${interval.short}</span>
                <span class="text-[9px] sm:text-[10px] hidden sm:block whitespace-nowrap mt-0.5 opacity-90">${interval.name.split(' ')[0]}</span>
            `;
            
            btn.onclick = () => {
                if (state.selectedIntervals.has(interval.id)) {
                    state.selectedIntervals.delete(interval.id);
                } else {
                    state.selectedIntervals.add(interval.id);
                }
                const nowSelected = state.selectedIntervals.has(interval.id);
                btn.className = `btn-interval flex flex-col items-center justify-center p-2 rounded-xl border transition-all ${
                    nowSelected ? selectedClasses : unselectedClasses
                }`;
            };
            return btn;
        }

        INTERVALS.filter(i => i.row === 1).forEach(i => intervalRow1.appendChild(renderIntervalBtn(i)));
        INTERVALS.filter(i => i.row === 2).forEach(i => intervalRow2.appendChild(renderIntervalBtn(i)));

        selectAllBtn.onclick = () => {
            const allSelected = state.selectedIntervals.size === INTERVALS.length;
            if (allSelected) {
                state.selectedIntervals.clear();
            } else {
                INTERVALS.forEach(i => state.selectedIntervals.add(i.id));
            }
            intervalRow1.innerHTML = '';
            intervalRow2.innerHTML = '';
            INTERVALS.filter(i => i.row === 1).forEach(i => intervalRow1.appendChild(renderIntervalBtn(i)));
            INTERVALS.filter(i => i.row === 2).forEach(i => intervalRow2.appendChild(renderIntervalBtn(i)));
        };

        function updateDirUI() {
            dirButtons.forEach(btn => {
                if (btn.dataset.dir === state.direction) {
                    btn.classList.add('bg-indigo-600', 'shadow', 'text-white');
                    btn.classList.remove('text-slate-300', 'hover:text-white');
                } else {
                    btn.classList.remove('bg-indigo-600', 'shadow', 'text-white');
                    btn.classList.add('text-slate-300', 'hover:text-white');
                }
            });
        }
        
        dirButtons.forEach(btn => {
            btn.onclick = () => {
                state.direction = btn.dataset.dir;
                updateDirUI();
            };
        });
        updateDirUI();

        baseNoteSelect.onchange = (e) => {
            state.baseNoteSetting = e.target.value;
        };

        function generateTask() {
            if (state.selectedIntervals.size === 0) {
                showMessage("Выберите хотя бы один интервал для тренировки!");
                return;
            }

            const availableIntervals = INTERVALS.filter(i => state.selectedIntervals.has(i.id));
            const selectedInterval = availableIntervals[Math.floor(Math.random() * availableIntervals.length)];

            let dir = state.direction;
            if (dir === 'both') {
                dir = Math.random() > 0.5 ? 'up' : 'down';
            }

            let baseNote = state.baseNoteSetting;
            let baseIndex = -1;
            
            if (baseNote === 'chain') {
                if (state.currentTask && state.currentTask.targetNote) {
                    baseIndex = FULL_SCALE.indexOf(state.currentTask.targetNote);
                } else {
                    baseIndex = RANDOM_BASE_MIN_INDEX + Math.floor(Math.random() * (RANDOM_BASE_MAX_INDEX - RANDOM_BASE_MIN_INDEX + 1));
                }
            } else if (baseNote === 'random') {
                baseIndex = RANDOM_BASE_MIN_INDEX + Math.floor(Math.random() * (RANDOM_BASE_MAX_INDEX - RANDOM_BASE_MIN_INDEX + 1));
            } else {
                baseIndex = FULL_SCALE.indexOf(baseNote);
            }

            // Проверка диапазона и перенос октавы при необходимости
            let targetIndex = dir === 'up' ? baseIndex + selectedInterval.semitones : baseIndex - selectedInterval.semitones;
            
            if (dir === 'up' && targetIndex > VOCAL_MAX_INDEX) {
                baseIndex -= 12;
            } else if (dir === 'down' && targetIndex < VOCAL_MIN_INDEX) {
                baseIndex += 12;
            }

            while (baseIndex > VOCAL_MAX_INDEX) baseIndex -= 12;
            while (baseIndex < VOCAL_MIN_INDEX) baseIndex += 12;

            targetIndex = dir === 'up' ? baseIndex + selectedInterval.semitones : baseIndex - selectedInterval.semitones;
            if (targetIndex > VOCAL_MAX_INDEX) baseIndex -= 12;
            if (targetIndex < VOCAL_MIN_INDEX) baseIndex += 12;

            targetIndex = dir === 'up' ? baseIndex + selectedInterval.semitones : baseIndex - selectedInterval.semitones;

            if (baseIndex < 0) baseIndex = 0;
            if (baseIndex >= FULL_SCALE.length) baseIndex = FULL_SCALE.length - 1;
            if (targetIndex < 0) targetIndex = 0;
            if (targetIndex >= FULL_SCALE.length) targetIndex = FULL_SCALE.length - 1;

            state.currentTask = {
                baseNote: FULL_SCALE[baseIndex],
                targetNote: FULL_SCALE[targetIndex],
                interval: selectedInterval,
                direction: dir
            };

            updateTaskUI();
        }

        function updateTaskUI() {
            const task = state.currentTask;
            if (!task) return;

            document.getElementById('uiBaseNote').textContent = formatNoteAcademic(task.baseNote);
            document.getElementById('uiInterval').textContent = task.interval.short;
            
            const dirIcon = document.getElementById('uiDirectionIcon');
            const dirText = document.getElementById('uiDirectionText');
            
            if (task.direction === 'up') {
                dirIcon.innerHTML = getArrowIcon('up');
                dirIcon.className = 'bg-emerald-500/80 p-2 rounded-full text-white shadow-lg shadow-emerald-900/50';
                dirText.textContent = 'вверх';
            } else {
                dirIcon.innerHTML = getArrowIcon('down');
                dirIcon.className = 'bg-rose-500/80 p-2 rounded-full text-white shadow-lg shadow-rose-900/50';
                dirText.textContent = 'вниз';
            }

            const answerBlock = document.getElementById('answerBlock');
            answerBlock.classList.remove('opacity-100');
            answerBlock.classList.add('opacity-0');
            document.getElementById('uiTargetNote').textContent = formatNoteAcademic(task.targetNote);

            const checkBtn = document.getElementById('checkBtn');
            checkBtn.classList.add('pulse-animation');
            checkBtn.innerHTML = `
                <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                <span class="text-xs sm:text-sm truncate">Проверить</span>
            `;
        }

        function showMessage(msg) {
            const popup = document.createElement('div');
            popup.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 bg-rose-600 text-white px-5 py-2.5 rounded-full shadow-2xl z-50 transition-all font-medium text-xs sm:text-sm flex items-center gap-2';
            popup.innerHTML = `<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> ${msg}`;
            document.body.appendChild(popup);
            setTimeout(() => {
                popup.style.opacity = '0';
                popup.style.transform = 'translate(-50%, -20px)';
                setTimeout(() => popup.remove(), 300);
            }, 3000);
        }

        function updatePlayBtnUI(isPlaying) {
            const btn = document.getElementById('playBaseBtn');
            if (isPlaying) {
                btn.innerHTML = `<svg class="w-4 h-4 text-rose-300" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd"></path></svg> Остановить тон`;
                btn.classList.remove('bg-slate-800', 'hover:bg-slate-700', 'border-slate-600');
                btn.classList.add('bg-rose-600/80', 'hover:bg-rose-600', 'border-rose-500');
            } else {
                btn.innerHTML = `<svg class="w-4 h-4 text-indigo-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg> Дать тон (База)`;
                btn.classList.remove('bg-rose-600/80', 'hover:bg-rose-600', 'border-rose-500');
                btn.classList.add('bg-slate-800', 'hover:bg-slate-700', 'border-slate-600');
            }
        }

        function startDrone(note) {
            if (!synthBase) return;
            const now = Tone.now();
            if (state.isDronePlaying) {
                synthBase.frequency.rampTo(note, 0.05, now);
            } else {
                synthBase.triggerAttack(note, now);
                state.isDronePlaying = true;
            }
            updatePlayBtnUI(true);
        }

        function stopDrone() {
            if (state.isDronePlaying && synthBase) {
                const now = Tone.now();
                synthBase.triggerRelease(now);
                state.isDronePlaying = false;
                updatePlayBtnUI(false);
            }
        }

        document.getElementById('playBaseBtn').onclick = async () => {
            if (!state.currentTask) return;
            await initAudio();
            
            if (state.isDronePlaying) {
                stopDrone();
            } else {
                startDrone(state.currentTask.baseNote);
            }
        };

        document.getElementById('checkBtn').onclick = async () => {
            if (!state.currentTask) return;
            await initAudio();
            
            const btn = document.getElementById('checkBtn');
            btn.classList.remove('pulse-animation');
            btn.innerHTML = `
                <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M2 10a8 8 0 1116 0 8 8 0 01-16 0zm11.707-2.707a1 1 0 00-1.414-1.414L9 9.586 7.707 8.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                <span class="text-xs sm:text-sm truncate">Ещё раз</span>
            `;
            
            const answerBlock = document.getElementById('answerBlock');
            answerBlock.classList.remove('opacity-0');
            answerBlock.classList.add('opacity-100');

            const now = Tone.now();
            const { targetNote, baseNote } = state.currentTask;
            const playDuration = 2.5;

            if (!state.isDronePlaying) {
                synthBase.triggerAttack(baseNote, now);
                state.isDronePlaying = true;
                updatePlayBtnUI(true);
            }
            
            synthTarget.triggerAttackRelease(targetNote, playDuration, now);
        };

        document.getElementById('nextTaskBtn').onclick = async () => {
            await initAudio(); 
            const now = Tone.now();
            
            if (synthTarget) synthTarget.triggerRelease(now);
            
            generateTask();

            if (state.isDronePlaying) {
                synthBase.frequency.rampTo(state.currentTask.baseNote, 0.05, now);
            }
        };

        const unlockAudioContext = () => {
            initAudio();
            document.body.removeEventListener('click', unlockAudioContext);
            document.body.removeEventListener('touchstart', unlockAudioContext);
        };

        window.onload = () => {
            generateTask();
            document.body.addEventListener('click', unlockAudioContext, { once: true });
            document.body.addEventListener('touchstart', unlockAudioContext, { once: true });
        };
    </script>
</body>
